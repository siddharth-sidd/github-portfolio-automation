

name: Gemini improvement proposal test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out controller
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate sample proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_improvement.py \
            --repo-path . \
            --output improvement-proposal.md

      - name: Upload proposal for inspection
        uses: actions/upload-artifact@v4
        with:
          name: gemini-improvement-proposal
          path: improvement-proposal.md
          if-no-files-found: error
