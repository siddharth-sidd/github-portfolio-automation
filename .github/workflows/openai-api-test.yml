name: Gemini API connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out controller
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google GenAI SDK
        run: python -m pip install google-genai

      - name: Test Gemini API connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          response = client.models.generate_content(
              model="gemini-3.8-flash",
              contents="Reply with exactly: Gemini API connection successful"
          )

          print(response.text)
          PY
